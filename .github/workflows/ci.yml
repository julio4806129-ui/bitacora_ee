name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bitacora_test
          POSTGRES_USER: bitacora_user
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bitacora_user -d bitacora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (black, isort, flake8)
        run: |
          black --check .
          isort --check-only .
          flake8 .

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: test-secret-key-ci-only-not-for-prod
          DJANGO_DEBUG: "True"
          USE_SQLITE: "False"
          DB_NAME: bitacora_test
          DB_USER: bitacora_user
          DB_PASSWORD: testpass
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py migrate --noinput
          pytest --cov=buses --cov=poller -q
